<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Thesis Mentor Chat</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/app.js" defer></script>
</head>

<body>
    
<header>
    <img src="/static/images/logoTM.png" alt="Logo" class="logo">
    <nav>
        <a href="/">Home</a>
        <a href="#features">Features</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<div class="layout">

    <!-- LEFT : CHAT -->
    <section class="chat-pane">
        <div class="upload-box">
            <input id="pdfFile" type="file" accept="application/pdf" />
            <button id="uploadBtn" class="primary-btn">Upload PDF</button>
            <p id="status"></p>
        </div>

        <div class="chat-box">
            <div class="messages">
                <pre id="answer"></pre>
            </div>
            <div class="input-area">
                <input id="query" type="text" placeholder="Ask a question about the document..." />
                <button id="askBtn">Ask</button>
            </div>
        </div>
    </section>

    <!-- RIGHT : PDF -->
    <section class="pdf-pane">
        <iframe id="pdfFrame" title="PDF Viewer" src=""></iframe>
    </section>

</div>

</body>
</html>
